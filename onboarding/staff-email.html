<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>My email inbox · AutoDealership.SI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f7;color:#182532;font:16px/1.5 system-ui,sans-serif}main{max-width:660px;margin:clamp(20px,6vw,72px) auto;padding:0 16px}article{background:white;border:1px solid #cfd9e0;border-radius:18px;padding:clamp(22px,6vw,46px);box-shadow:0 12px 38px #263e5412}h1{font-size:clamp(28px,6vw,40px);letter-spacing:-.045em;line-height:1.1;margin:.4em 0}h2{font-size:17px}p{color:#45586a}.brand{font-weight:750;color:#173a51}.connection{padding:14px 18px;border-radius:10px;background:#ecf5f5;overflow-wrap:anywhere}label{display:grid;gap:5px;margin-top:15px;font-weight:600}input,select,button{font:inherit;max-width:100%;border-radius:7px}input,select{padding:10px;border:1px solid #80919c;background:#fff;color:#172e3d}button{cursor:pointer;background:#13526b;color:white;font-weight:650;border:0;padding:11px 16px;margin:18px 6px 0 0}button:disabled{opacity:.65;cursor:default}.secondary{background:#e4edf1;color:#214457}a{color:#14556e}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #258abc;outline-offset:3px}hr{border:0;border-top:1px solid #dce4e9;margin:24px 0}#status{min-height:1.5em;font-weight:600}small{font-weight:400;color:#45586a}[hidden]{display:none!important}
</style></head><body><main><article><div class="brand">AutoDealership.SI</div><h1>My email inbox</h1><p id="intro">Opening your dealership workspace…</p><div id="setup" hidden><div id="connection" class="connection"></div><button class="secondary" id="disconnect" hidden>Disconnect this inbox</button><hr><form id="mail"><label>Email provider<select id="kind"><option value="google">Gmail or Google Workspace</option><option value="yahoo">Yahoo Mail</option><option value="imap">Other IMAP and SMTP provider</option></select></label>
<div id="google"><p id="googleInfo"></p></div>
<fieldset id="manual" hidden disabled style="border:0;margin:0;padding:0"><label>Mailbox address<input id="address" type="email" autocomplete="username" maxlength="254" required></label><label>Mailbox app password<input id="password" type="password" autocomplete="off" maxlength="512" required></label><p id="hint"></p>
<fieldset id="custom" hidden disabled style="border:0;margin:0;padding:0"><label>Incoming IMAP server <small>Port 993 with TLS</small><input id="imap" placeholder="imap.example.com" required></label><label>Outgoing SMTP server<input id="smtp" placeholder="smtp.example.com" required></label><label>SMTP port<select id="port"><option value="465">465 · TLS</option><option value="587">587 · STARTTLS</option></select></label><label>Separate SMTP app password <small>Leave blank if the passwords match.</small><input id="smtpPassword" type="password" autocomplete="off" maxlength="512"></label></fieldset></fieldset><button id="submit" type="submit">Connect</button></form></div><p id="status" role="status" aria-live="polite"></p><a id="back" hidden>Return to Conversations</a></article></main>
<script>
const by=id=>document.getElementById(id);let config,busy=false;
async function api(action,data={}){const res=await fetch("/onboarding/staff-email/"+action,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const json=await res.json();if(!res.ok)throw Error(json.error||"Could not open your inbox settings.");return json;}
function render(){const google=by("kind").value==="google",custom=by("kind").value==="imap";by("google").hidden=!google;by("manual").hidden=by("manual").disabled=google;by("custom").hidden=by("custom").disabled=!custom;
by("hint").textContent=custom?"Use the server names and credentials supplied by your email provider.":"Generate an app password in your Yahoo account and enter it here.";
by("googleInfo").textContent=config.google?"Sign in with Google to send customer emails and sync replies to Conversations.":"Google sign-in is awaiting platform setup. If your Google account allows app passwords, choose Other and enter your Gmail IMAP and SMTP settings.";
by("submit").textContent=google?"Continue with Google":"Verify and connect";by("submit").disabled=busy||(google&&!config.google);by("disconnect").disabled=busy;}
async function status(){config=await api("status");const g=config.grant;by("intro").textContent=config.name+" · Send as yourself and see customer replies in Conversations.";by("connection").textContent=g?[g.address,g.issue||"Connected",g.last_sync?"Last checked "+new Date(g.last_sync).toLocaleString():""].filter(Boolean).join(" · "):"No personal inbox connected.";by("disconnect").hidden=!g;by("setup").hidden=false;by("back").href=config.dashboard;by("back").hidden=false;if(g)by("kind").value=g.kind;render();}
by("kind").onchange=render;
by("mail").onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;render();by("status").textContent="Connecting…";try{if(by("kind").value==="google"){location.assign((await api("google")).url);return;}const data={};for(const k of ["kind","address","password","smtpPassword","imap","smtp","port"])data[k]=by(k).value;await api("connect",data);by("password").value=by("smtpPassword").value="";await status();by("status").textContent="Your inbox is connected.";}catch(err){by("status").textContent=err.message;}finally{busy=false;render();}};
by("disconnect").onclick=async()=>{if(busy)return;busy=true;render();try{await api("disconnect");await status();by("status").textContent="Inbox disconnected. Conversation history is available in the dealership.";}catch(e){by("status").textContent=e.message;}finally{busy=false;render();}};
(async()=>{const ticket=location.hash.slice(1),result=new URLSearchParams(location.search).get("result");history.replaceState(null,"",location.pathname);try{if(ticket)await api("enter",{ticket});await status();if(result)by("status").textContent=result==="connected"?"Your Google inbox is connected.":"Google authorization did not finish. Try connecting again.";}catch(e){by("intro").textContent="Open this page from Conversations in your dealership dashboard.";by("status").textContent=e.message;}})();
</script></body></html>
