location ^~ /onboarding/ {
    if ($scheme = http) { return 308 https://autodealership.si$request_uri; }
    proxy_pass http://127.0.0.1:18485;
}
location ^~ /clients/ {
    if ($scheme = http) { return 308 https://autodealership.si$request_uri; }
    # Keep the private dealer workspace and its API on the authenticated origin.
    if ($uri ~ "^/clients/(?<storefront>[a-z0-9]+(?:-[a-z0-9]+)*)/?$") {
        return 302 https://$storefront.autodealership.si/$is_args$args;
    }
    if ($uri ~ "^/clients/(?<storefront_page>[a-z0-9]+(?:-[a-z0-9]+)*)/(?<public_page>index|vehicle|page)[.]html$") {
        return 302 https://$storefront_page.autodealership.si/$public_page.html$is_args$args;
    }
    client_max_body_size 7m;
    proxy_pass http://127.0.0.1:18284;
    proxy_set_header Host autodealership.si;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
