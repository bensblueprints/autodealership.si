<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Dealer email setup | AutoDealership.SI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17283a;font:16px/1.55 system-ui,sans-serif}header{background:#101d2c;padding:18px max(5vw,20px);display:flex;gap:16px;align-items:center;color:white}header img{width:148px;height:auto}header span{border-left:1px solid #667585;padding-left:16px}main{max-width:820px;margin:44px auto;padding:0 20px}h1{font-size:clamp(1.8rem,5vw,2.7rem);line-height:1.12;margin:10px 0 18px;letter-spacing:-.04em}h2{font-size:1.25rem;margin:0 0 10px}p{margin:8px 0 14px}section{background:#fff;padding:clamp(18px,4vw,32px);border:1px solid #ced6de;border-radius:16px;margin:18px 0}button,a{font:inherit}button{font-weight:650;cursor:pointer;border-radius:7px;border:1px solid #53677a;background:white;color:#17283a;padding:9px 14px}button.primary{background:#163c4d;color:white}button:disabled{opacity:.55;cursor:wait}a{color:#164e63}label{display:block;font-weight:600}input{display:block;width:100%;max-width:460px;margin:5px 0 12px;border:1px solid #6b8091;border-radius:6px;font:inherit;padding:9px}ul{padding-left:20px}li{overflow-wrap:anywhere;margin:14px 0}code{display:block;white-space:pre-wrap;overflow-wrap:anywhere;background:#eff4f6;padding:6px;border-radius:4px}[role=status]:not(:empty){font-weight:600;background:#e1eef2;border-radius:8px;padding:12px}small{display:block;color:#495c6f}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #007a93;outline-offset:3px}[hidden]{display:none!important}
</style></head><body><header><img src="/brand/logo-white.webp" alt="AutoDealership.SI"><span>Dealer workspace</span></header>
<main><a id="back" hidden>Return to dealer dashboard</a><h1 id="title">Dealership email</h1><p id="message" role="status" aria-live="polite">Opening email setup…</p>
<section id="team" hidden><h2>Resend team</h2><p id="summary"></p><button class="primary" id="connect">Connect Resend</button> <button id="disconnect" hidden>Disconnect team</button>
<div id="confirm" hidden><p>Disconnecting removes this dealership’s access to the team.</p><button id="remove">Confirm disconnect</button> <button id="cancel">Keep connection</button></div></section>
<section id="sender" hidden><h2>Sending domain</h2><p>Use a dedicated subdomain of a domain your dealership owns. Your main mailbox can keep its current DNS records.</p><form id="domain-form"><label for="domain">Dealership sending subdomain</label><input id="domain" required autocomplete="off" placeholder="mail.yourdealership.com"><button class="primary" id="save">Find or add domain in Resend</button> <button type="button" id="verify" hidden>Check DNS verification</button></form>
<p id="dns-state"></p><ul id="records"></ul></section></main><script>
"use strict";
const el = id => document.getElementById(id);
const ticket = location.hash.slice(1);
const outcome = new URLSearchParams(location.search).get("result");
history.replaceState(null,"","/onboarding/email");
let current;
async function api(action, fields = {}) {
  const r = await fetch("/onboarding/email/"+action,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({site:current?.site,...fields})});
  const data = await r.json(); if(!r.ok)throw Error(data.error || "Could not open email settings.");return data;
}
function render(s) {
  current=s;el("title").textContent=s.name+" email";el("team").hidden=false;
  el("back").href="https://"+s.slug+".autodealership.si/dealer";el("back").hidden=false;
  el("summary").textContent=s.reconnect?"Resend needs a new authorization for this dealership.":s.connected?"This dealership has authorized a Resend team. Usage and provider billing belong to the selected team.":"Sign in to Resend with the dealer’s business account and choose this dealership’s team. Approve access to manage its sending domain. Resend requires full access for domain verification.";
  el("connect").hidden=s.connected&&!s.reconnect;el("connect").textContent=s.reconnect?"Reconnect Resend":"Connect Resend";
  el("disconnect").hidden=!s.connected;el("confirm").hidden=true;
  el("sender").hidden=!s.connected||s.reconnect;el("domain").value=s.domain||"";
  el("domain").readOnly=!!s.domain;el("save").textContent=s.domain?"Show DNS records":"Find or add domain in Resend";el("verify").hidden=!s.domain;
  el("dns-state").textContent=s.domain?(s.verified?"Sending domain verified.":"DNS verification pending."):"";el("records").replaceChildren();
}
async function run(button,work){
  document.querySelectorAll("button").forEach(b=>b.disabled=true);el("message").textContent="";
  try{await work();}catch(err){el("message").textContent=err.message;}finally{document.querySelectorAll("button").forEach(b=>b.disabled=false);}
}
el("connect").onclick=e=>run(e.target,async()=>{location.assign((await api("connect")).url);});
el("disconnect").onclick=()=>{el("confirm").hidden=false;el("cancel").focus();};
el("cancel").onclick=()=>{el("confirm").hidden=true;el("disconnect").focus();};
el("remove").onclick=e=>run(e.target,async()=>{render(await api("disconnect"));el("message").textContent="Team disconnected.";});
async function domain(action){
  const d=await api(action,{domain:el("domain").value.trim()});
  render({...current,domain:d.domain,verified:d.verified});
  el("dns-state").textContent=d.verified?"Sending domain verified.":"Publish these records at your DNS provider. Then check verification.";
  for(const r of d.records){
    const li=document.createElement("li"),value=document.createElement("code");
    li.textContent=[r.record,r.type,r.name,r.priority==null?"":"priority "+r.priority,r.status].filter(Boolean).join(" · ");
    value.textContent=r.value;li.append(value);el("records").append(li);
  }
}
el("domain-form").onsubmit=e=>{e.preventDefault();run(e.submitter,()=>domain("domain"));};
el("verify").onclick=e=>run(e.target,()=>domain("verify"));
(async()=>{if(ticket)await api("enter",{ticket});render(await api("status"));
  const messages={connected:"Resend team connected. Configure the dealership’s sending domain below.",canceled:"Authorization canceled.",expired:"This approval expired. Start a new connection.",failed:"Resend could not complete authorization. Try again."};
  el("message").textContent=messages[outcome]||"";
})().catch(err=>{el("message").textContent=err.message;});
</script></body></html>
