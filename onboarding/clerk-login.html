<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff sign-in · AutoDealership.SI</title>
<style>body{background:#121620;color:#f5f6fa;font:16px system-ui;margin:8vh auto;padding:24px;max-width:480px}button,input{font:inherit;padding:12px;border-radius:8px}button{cursor:pointer}a{color:#95c9ff}</style>
<a href="https://autodealership.si/" aria-label="AutoDealership.SI home"><img src="https://autodealership.si/brand/logo-dark.webp" alt="AutoDealership.SI" width="186" height="62" style="display:block;width:min(186px,39vw);height:auto"></a><h1>Staff sign-in</h1><p id="status">Connecting to Clerk…</p><div id="auth"></div>
<script>
const params=new URLSearchParams(location.search);
const site=params.get("site");
const role=site?"platform":params.get("role")==="owner"?"owner":"engineer";
const statusText=document.querySelector("#status");
function failed(){statusText.textContent="Could not connect to Clerk. Please reload to try again."}
async function enter(){
 const response=await fetch("/onboarding/clerk-exchange",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:await Clerk.session.getToken(),role})});
 const result=await response.json();
 if(!response.ok){statusText.textContent=result.error||"Access denied.";return}
 if(site){
   const desk=await fetch("/onboarding/open-desk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug:site})});
   const target=await desk.json();
   if(!desk.ok){statusText.textContent=target.error||"This dealership is unavailable.";return}
   location.replace(target.url);return
 }
 location.replace(role==="owner"?"/onboarding/admin":"/onboarding/");
}
async function start(){try{await Clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});if(Clerk.session){if(location.pathname.endsWith("/clerk-team")){
 const memberships=await Clerk.user.getOrganizationMemberships();
 const match=memberships.data.find(m=>m.organization.id==="org_3MbiCG7rWv2mpK2XJJX7FGnqZxg");
 if(!match){statusText.textContent="Accept your Southern Ohio invitation to access this team.";return}
 await Clerk.setActive({organization:match.organization.id});
 statusText.textContent="Southern Ohio Auto Sales";Clerk.mountOrganizationProfile(document.querySelector("#auth"),{routing:"hash"});return
 }await enter();return}statusText.textContent="Use your work email.";Clerk.mountSignIn(document.querySelector("#auth"),{appearance:{options:{logoImageUrl:"https://autodealership.si/brand/logo-white.webp"}},routing:"hash",forceRedirectUrl:location.href,signUpForceRedirectUrl:location.href})}catch(e){failed()}}
</script>

<script crossorigin="anonymous" src="https://clerk.autodealership.si/npm/@clerk/ui@1/dist/ui.browser.js"></script><script async crossorigin="anonymous" data-clerk-publishable-key="__KEY__" src="https://clerk.autodealership.si/npm/@clerk/clerk-js@6/dist/clerk.browser.js" onload="start()" onerror="failed()"></script>
