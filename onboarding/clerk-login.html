<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff sign-in · AutoDealership.SI</title>
<style>body{background:#121620;color:#f5f6fa;font:16px system-ui;margin:8vh auto;padding:24px;max-width:480px}button,input{font:inherit;padding:12px;border-radius:8px}button{cursor:pointer}a{color:#95c9ff}</style>
<a href="https://autodealership.si/" aria-label="AutoDealership.SI home"><img src="https://autodealership.si/brand/logo-dark.webp" alt="AutoDealership.SI" width="186" height="62" style="display:block;width:min(186px,39vw);height:auto"></a><h1>Staff sign-in</h1><p id="status" role="status">Connecting to Clerk…</p><div id="auth"></div><div id="recovery" hidden><button id="retry" type="button">Try again</button> <button id="switch" type="button">Sign in with another account</button></div>
<p><a id="hosted" href="https://accounts.autodealership.si/sign-in?redirect_url=https%3A%2F%2Fautodealership.si%2Fadmin">Open secure sign-in in a full page</a></p>
<script>
const params=new URLSearchParams(location.search);
const site=params.get("site");
const role=site?"platform":params.get("role")==="owner"?"owner":"engineer";
const statusText=document.querySelector("#status");
const recovery=document.querySelector("#recovery");
function problem(message){statusText.textContent=message;recovery.hidden=false;document.querySelector("#switch").hidden=!window.Clerk?.session;}
function failed(){problem("Could not connect to Clerk. Try again to reconnect.");}
const returnUrl=new URL(location.pathname+location.search,location.origin).href;
document.querySelector("#hosted").href="https://accounts.autodealership.si/sign-in?redirect_url="+encodeURIComponent(returnUrl);
document.querySelector("#retry").onclick=()=>location.reload();
document.querySelector("#switch").onclick=async()=>{try{await Clerk.signOut({redirectUrl:returnUrl});}catch{failed();}};
async function openDesk(){
 const desk=await fetch("/onboarding/open-desk",{method:"POST",signal:AbortSignal.timeout(15000),headers:{"Content-Type":"application/json"},body:JSON.stringify({slug:site})});
 if(desk.status===401)return false;
 const target=await desk.json();
 if(!desk.ok){problem(target.error||"This dealership is unavailable.");return true}
 location.replace(target.url);return true;
}
async function enter(){
 const response=await fetch("/onboarding/clerk-exchange",{method:"POST",signal:AbortSignal.timeout(20000),headers:{"Content-Type":"application/json"},body:JSON.stringify({token:await Clerk.session.getToken({skipCache:true}),role})});
 const result=await response.json();
 if(!response.ok){problem(result.error||"Access denied.");return}
 if(site){if(!await openDesk())problem("Please reconnect your staff account.");return}
 location.replace(role==="owner"?"/onboarding/admin":"/onboarding/");
}
async function start(){try{if(site && await openDesk())return;await Clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});if(Clerk.session){if(location.pathname.endsWith("/clerk-team")){
 const organization=params.get("org")||"org_3MbiCG7rWv2mpK2XJJX7FGnqZxg";
 try{await Clerk.setActive({organization});}catch{problem("Use the account invited to this dealership, or accept its invitation first.");return}
 statusText.textContent="Dealership staff";Clerk.mountOrganizationProfile(document.querySelector("#auth"),{routing:"hash"});return
 }await enter();return}statusText.textContent="Use your work email.";Clerk.mountSignIn(document.querySelector("#auth"),{appearance:{options:{logoImageUrl:"https://autodealership.si/brand/logo-white.webp"}},routing:"hash",forceRedirectUrl:location.href,signUpForceRedirectUrl:location.href})}catch(e){failed()}}
</script>

<script crossorigin="anonymous" src="https://clerk.autodealership.si/npm/@clerk/ui@1/dist/ui.browser.js"></script><script async crossorigin="anonymous" data-clerk-publishable-key="__KEY__" src="https://clerk.autodealership.si/npm/@clerk/clerk-js@6/dist/clerk.browser.js" onload="start()" onerror="failed()"></script>
