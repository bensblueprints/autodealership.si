<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineer sign in · AutoDealership.SI</title><style>body{background:#121416;color:#f6f4ee;font:16px/1.5 system-ui}main{max-width:420px;margin:10vh auto;padding:28px}label{display:block;margin-block:16px}input{width:100%;box-sizing:border-box;padding:12px}button{padding:12px 20px;background:#ff8a69;border:0;border-radius:6px;font-weight:bold}a{color:#ffb397}</style><main><small>AutoDealership.SI / Customer onboarding</small><h1>Engineer sign in</h1><p><a style="color:inherit" href="/onboarding/clerk-login?role=engineer">Sign in with Clerk</a></p><form><label>Work email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" minlength="14" maxlength="128" required></label><button>Sign in</button></form><p role="status"></p><a href="/onboarding/owner">Owner sign in</a></main><script>
const f=document.querySelector('form'),invite=new URLSearchParams(location.hash.slice(1)).get('invite');if(invite){history.replaceState(null,'','/onboarding/');document.querySelector('h1').textContent='Activate engineer account';f.email.required=false;f.email.closest('label').hidden=true;f.password.autocomplete='new-password';f.querySelector('button').textContent='Set password and continue'}
f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/onboarding/'+(invite?'claim':'signin'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invite,email:f.email.value,password:f.password.value})});if(!r.ok)throw Error((await r.json()).error);location.replace('/onboarding/')}catch(err){document.querySelector('[role=status]').textContent=err.message}}
</script></html>
