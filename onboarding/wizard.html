<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer onboarding · AutoDealership.SI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#121416;color:#f5f2ed;font:16px/1.5 system-ui}main{max-width:800px;margin:auto;padding:40px 20px}fieldset,article{background:#212529;border:1px solid #454a50;border-radius:12px;padding:24px;margin:16px 0}legend{font-size:1.25rem;font-weight:700}label{display:block;margin:12px 0}input:not([type=checkbox]){display:block;width:100%;padding:10px;background:#16191c;color:white;border:1px solid #788088;border-radius:6px}button{background:#343c42;border:1px solid #757d85;border-radius:6px;padding:9px 15px;color:white;cursor:pointer}button[type=submit]{background:#ff8a69;color:#211310}a{color:#ffb398;margin-right:15px}small{color:#ccd0d4}#review{white-space:pre-line}</style>
<main><small>AutoDealership.SI / Client services</small><nav><a href="/onboarding/">Customer onboarding</a> <a href="/onboarding/admin">Client admin</a></nav><h1>Customer onboarding</h1><form>
<fieldset><legend>1 · Dealership</legend><label>Dealership name<input name="name" required maxlength="100"></label><label>Preview subdomain<input name="slug" required minlength="3" maxlength="50" placeholder="southern-ohio-auto-sales"></label><label>Future custom hostname (optional)<input name="domain" placeholder="www.example.com"></label><label>Dealer dashboard password<input name="password" type="password" autocomplete="new-password" minlength="14" required></label></fieldset>
<fieldset hidden><legend>2 · Agreement and services</legend><label>Private monthly rate ($)<input name="rate" type="number" min="0" max="100000" step="1" value="100" required></label><label><input type="checkbox" name="bhph" checked> Buy Here Pay Here</label><label><input type="checkbox" name="voice" checked> ElevenLabs website concierge</label><p>Phone routing is off. Creating a preview records the agreement without collecting payment.</p></fieldset>
<fieldset hidden><legend>3 · Review</legend><p id="review"></p></fieldset>
<button type="button" id="back" hidden>Back</button> <button type="button" id="next">Continue</button> <button type="submit" id="create" hidden>Create client website</button></form><p role="status" id="status"></p><section id="team" hidden><h2>Engineering team</h2><label>Engineer work email<input id="invite-email" type="email"></label><button id="invite">Create invitation</button><p id="invite-result"></p><div id="members"></div></section><button id="logout" hidden>Sign out</button><h2>Client websites</h2><div id="sites"></div></main>
<script>
const f=document.querySelector('form'),groups=[...f.querySelectorAll('fieldset')],el=id=>document.getElementById(id);let step=0;
let manualSlug=false;f.slug.oninput=()=>{manualSlug=!!f.slug.value};f.elements.name.oninput=()=>{if(!manualSlug)f.slug.value=f.elements.name.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)};if(location.pathname.endsWith('/admin')){document.querySelector('h1').textContent='Client admin';f.hidden=true;el('team').after(document.createElement('hr'));document.querySelector('#sites').previousElementSibling.textContent='All clients';const sites=el('sites');const title=sites.previousElementSibling;document.querySelector('h1').after(title,sites);}
function payload(){return {name:f.elements.name.value.trim(),slug:f.slug.value.trim(),domain:f.domain.value.trim(),password:f.password.value,rate:Number(f.rate.value),voice:f.voice.checked,bhph:f.bhph.checked}}
function show(){groups.forEach((g,i)=>g.hidden=i!==step);el('back').hidden=!step;el('next').hidden=step===2;el('create').hidden=step!==2;const d=payload();el('review').textContent=[d.name,d.slug+'.autodealership.si','$'+d.rate+' / month · unpaid preview',d.bhph?'BHPH enabled':'Standard inventory',d.voice?'Website voice enabled':'Website only',d.domain].filter(Boolean).join('\n')}
el('next').onclick=()=>{if([...groups[step].querySelectorAll('input')].every(i=>i.reportValidity())){step++;show()}};el('back').onclick=()=>{step--;show()};
async function api(path,data){const r=await fetch('/onboarding/'+path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
let ownerTeam=null;
async function team(){const d=await api('team');ownerTeam=d.owner?d.team:null;el('team').hidden=!d.owner;el('logout').hidden=false;const members=el('members');members.replaceChildren();for(const m of d.team||[]){const p=document.createElement('p');p.textContent=m.email+' · '+(!m.active?'Disabled':m.joined?'Active':'Invited')+' ';if(m.active){const b=document.createElement('button');b.textContent='Disable access';b.onclick=async()=>{if(confirm('Disable onboarding access for '+m.email+'?')){await api('revoke',{engineer:m.id});await list()}};p.append(b)}members.append(p)}}
el('logout').onclick=async()=>{await api('logout',{});location.replace('/onboarding/')};el('invite').onclick=async()=>{try{const r=await api('invite',{email:el('invite-email').value});el('invite-result').textContent='Share this one-time link privately. It expires in 48 hours. '+r.url;await list()}catch(e){el('invite-result').textContent=e.message}};
async function list(){await team();const rows=await api('sites'),out=el('sites');out.replaceChildren();for(const row of rows){const a=document.createElement('article');function text(tag,value){const n=document.createElement(tag);n.textContent=value;a.append(n);return n}text('h3',row.name);text('p','$'+row.rate+'/month · Website · '+(row.voice?'Web voice: '+row.agent_state:'Web voice off'));for(const [label,path] of [['Open showroom','https://'+row.slug+'.autodealership.si/'],['Dealer dashboard','https://'+row.slug+'.autodealership.si/dealer']]){const link=text('a',label);link.href=path;if(label==='Dealer dashboard')link.onclick=async e=>{e.preventDefault();try{const r=await api('open-desk',{slug:row.slug});location.assign(r.url)}catch(err){el('status').textContent=err.message}}}if(ownerTeam && row.clerk_org_id){const invite=text('button','Invite dealer admin');invite.onclick=()=>{invite.disabled=true;const form=document.createElement('form'),email=document.createElement('input'),submit=document.createElement('button'),message=document.createElement('p');email.type='email';email.required=true;email.placeholder='Dealer email address';submit.textContent='Get private invitation link';form.append(email,submit,message);a.append(form);email.focus();form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const r=await api('dealer-invite',{slug:row.slug,email:email.value});const link=document.createElement('input');link.readOnly=true;link.value=r.url;message.textContent='Copy this private link and send it to the dealer.';message.append(link);link.select()}catch(err){message.textContent=err.message}finally{submit.disabled=false}}}}text('p','Preview hostname: '+row.slug+'.autodealership.si');text('small','Create a DNS-only A record to 95.216.117.238. HTTPS is provisioned after DNS resolves.');const domainButton=text('button','Connect custom domain');domainButton.onclick=async()=>{const domain=prompt('Enter the custom hostname',row.domain||'');if(!domain)return;try{await api('domain',{slug:row.slug,domain});await list()}catch(e){el('status').textContent=e.message}};if(row.domain)text('p','Point '+row.domain+' to 95.216.117.238 and add TXT _autodealership.'+row.domain+' = '+row.slug+'.autodealership.si. Connected domain: '+(row.verified_domain||'awaiting verification'));if(row.voice && ['pending','failed'].includes(row.agent_state)){const b=text('button','Set up website voice');b.onclick=async()=>{b.disabled=true;try{await api('voice',{slug:row.slug});await list()}catch(e){el('status').textContent=e.message;b.disabled=false}}}if(ownerTeam){const l=text('label','Assigned engineer');const sel=document.createElement('select');sel.add(new Option('Owner only',''));for(const m of ownerTeam.filter(x=>x.active))sel.add(new Option(m.email,m.id));sel.value=row.engineer||'';sel.onchange=async()=>{try{await api('assign',{slug:row.slug,engineer:sel.value});el('status').textContent='Assignment saved for '+row.name+'.'}catch(e){el('status').textContent=e.message;await list()}};l.append(sel)}out.append(a)}}
f.onsubmit=async e=>{e.preventDefault();if(step<2){el('next').click();return}const d=payload();el('create').disabled=true;try{await api('sites',d);f.reset();manualSlug=false;step=0;show();el('status').textContent='Website created.';await list();if(d.voice){await api('voice',{slug:d.slug});await list()}}catch(e){el('status').textContent=e.message;await list()}finally{el('create').disabled=false}};show();list().catch(e=>el('status').textContent=e.message)
</script></html>
