<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Your purchase feedback</title><link rel="stylesheet" href="purchase-feedback.css"><script defer src="purchase-feedback.js"></script></head>
<body><main><header><span id="dealer"></span><h1>Your purchase feedback</h1></header><p role="status" id="status">Opening your invitation…</p>
<section id="google" hidden><h2>Share a public review</h2><a id="google-link" target="_blank" rel="noopener noreferrer">Review us on Google ↗</a></section>
<form hidden><h2>Send private feedback to the dealership</h2><fieldset><legend>How was your purchase experience?</legend><div class="ratings"></div></fieldset><label for="comment">Anything else you'd like us to know? (optional)</label><textarea id="comment" maxlength="2000" rows="4"></textarea><button>Send private feedback</button></form>
<button id="stop" type="button" hidden>Unsubscribe from review emails</button></main></body></html>
