<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dealer sign in</title><style>*{box-sizing:border-box}body{background:#131618;color:#f7f4ee;font:16px/1.55 system-ui;margin:0}main{width:min(92%,440px);margin:12vh auto;padding:32px;background:#202429;border:1px solid #484e52;border-radius:16px}h1{font-size:36px;margin:8px 0 24px}label,input{display:block;width:100%}label{margin:16px 0}input{margin-top:5px;padding:12px;background:#111417;border:1px solid #798088;color:white;border-radius:6px;font:inherit}button{width:100%;background:#ff977a;color:#181413;border:0;border-radius:7px;padding:13px;font-weight:bold}a{color:#ffb9a5}</style><main><a href="https://autodealership.si/" aria-label="AutoDealership.SI home"><img src="https://autodealership.si/brand/logo-dark.webp" alt="AutoDealership.SI" width="186" height="62" style="display:block;width:min(186px,39vw);height:auto"></a><small>AutoDealership.SI / Dealer dashboard</small><h1>Dealer sign in</h1><form><label>Email or dealer username<input name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form><p role="status"></p><a href="./">Return to showroom</a></main><script>
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.target;f.querySelector('button').disabled=true;try{const r=await fetch('/api/dealer-auth/signin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});if(!r.ok)throw Error((await r.json()).error);location.replace('dealer')}catch(err){document.querySelector('[role=status]').textContent=err.message}finally{f.querySelector('button').disabled=false}}
</script></html>
