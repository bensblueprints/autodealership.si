server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/autodealership.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autodealership.si/privkey.pem;
    server_name autodealership.si;
    include /etc/nginx/snippets/autodealership-billing-routes.conf;
    include /etc/nginx/snippets/autodealership-onboarding.conf;
    root /var/www/autodealership-si;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/autodealership.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autodealership.si/privkey.pem;
    server_name demo.autodealership.si;
    client_max_body_size 7m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/autodealership-si; }
    location / {
        proxy_pass http://127.0.0.1:18284;
        proxy_set_header Host demo.autodealership.si;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

