services:
  showroom:
    image: node:22-bookworm-slim
    restart: unless-stopped
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    ports:
      - "127.0.0.1:18284:8080"
    environment:
      PORT: '8080'
      BIND_ADDRESS: '0.0.0.0'
      SHOWROOM_MODULE: 'file:///app/showroom.mjs'
      SHOWROOM_DATA: '/var/lib/showroom'
    volumes:
      - ./data:/var/lib/showroom
      - ./server.mjs:/app/server.mjs:ro
      - ./showroom.mjs:/app/showroom.mjs:ro
    command: ["node", "/app/server.mjs"]

