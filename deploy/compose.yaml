services:
  showroom:
    build:
      context: .
      network: host
      dockerfile: Showroom.Dockerfile
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    ports:
      - "127.0.0.1:18284:8080"
    environment:
      POSTGRES_PASSWORD: ${SHOWROOM_DB_PASSWORD:?required}
      DEALER_PASSWORD: ${SHOWROOM_DEALER_PASSWORD:?required}
      PORT: '8080'
      BIND_ADDRESS: '0.0.0.0'
      SHOWROOM_MODULE: 'file:///app/showroom.mjs'
      SHOWROOM_DATA: '/var/lib/showroom'
    volumes:
      - ./data:/var/lib/showroom
      - ./booking-database.mjs:/app/booking-database.mjs:ro
      - ./server.mjs:/app/server.mjs:ro
      - ./showroom.mjs:/app/showroom.mjs:ro
    command: ["node", "/app/server.mjs"]


  database:
    ports:
      - "127.0.0.1:18432:5432"
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: showroom
      POSTGRES_DB: showroom
      POSTGRES_PASSWORD: ${SHOWROOM_DB_PASSWORD:?required}
    volumes:
      - bookings:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "showroom"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  bookings:
