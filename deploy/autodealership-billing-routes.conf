    location ~ ^/billing/(signup|login)$ {
        limit_req zone=adsi_signup burst=6 nodelay;
        limit_req_status 429;
        if ($scheme = http) { return 308 https://autodealership.si$request_uri; }
        proxy_pass http://127.0.0.1:18285;
    }
    location /billing/ {
        if ($scheme = http) { return 308 https://autodealership.si$request_uri; }
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:18285;
    }
